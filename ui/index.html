/* ---- scroll while dragging (v6.2) ----
   On Windows the mouse wheel does nothing during a native drag, and the browser
   only auto-scrolls within a few pixels of the window edge. So while a card or a
   category is being dragged, holding it in a band at the top (just below the
   sticky Library header, or over the header itself) or at the bottom of the window
   scrolls the page, faster the deeper into the band. The tray is exempt so it
   can be dropped on. Driven by dragover (which keeps firing while the pointer
   rests) and stopped on drag end, on drop, or when dragover stops arriving. */
const AS_BAND=90, AS_MAX=28, AS_STALE_MS=500;   // band depth px, max px per frame, give-up time
let asX=0, asY=null, asLast=0, asRAF=0;
function autoScrollSpeed(y, top, bottom){
  if(y < top+AS_BAND){ const d=Math.min(1,(top+AS_BAND-y)/AS_BAND); return -Math.max(1,Math.round(AS_MAX*d*d)); }
  if(y > bottom-AS_BAND){ const d=Math.min(1,(y-(bottom-AS_BAND))/AS_BAND); return Math.max(1,Math.round(AS_MAX*d*d)); }
  return 0;
}
function autoScrollSpeedAt(x, y){
  const tray=$('#mtray');
  if(tray){ const r=tray.getBoundingClientRect(); if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return 0; }
  let top=0;
  const h=view==='library' ? document.querySelector('.libheader') : null;
  if(h && getComputedStyle(h).position==='sticky') top=Math.max(0, h.getBoundingClientRect().bottom);
  return autoScrollSpeed(y, top, window.innerHeight);
}
function onDocDragOver(e){
  if(!dragCardId && !dragCatId) return;
  asX=e.clientX; asY=e.clientY; asLast=Date.now();
  if(!asRAF) asRAF=requestAnimationFrame(autoScrollTick);
}
function autoScrollTick(){
  asRAF=0;
  if((!dragCardId && !dragCatId) || asY==null || Date.now()-asLast>AS_STALE_MS){ asY=null; return; }
  const v=autoScrollSpeedAt(asX, asY);
  if(v) window.scrollBy(0, v);
  asRAF=requestAnimationFrame(autoScrollTick);
}
function stopAutoScroll(){ asY=null; if(asRAF){ try{ cancelAnimationFrame(asRAF); }catch(_){} asRAF=0; } }

function onRollupDrop(e, targetCatId){

// Category rollups are built from the same filtered/sorted list the old flat grid used —
// filtering (search or a tag chip) forces every category with a hit open and hides the
// rest, so browsing a category never requires a second, separate search mechanism.
function rollupsHTML(){
  const list=visibleList();
  const filtering=!!(state.search && state.search.trim()) || state.tagFilters.length>0;
  const byCat={};

  for(const p of list){
    const key=p.categoryId||'__uncat__'; (byCat[key]=byCat[key]||[]).push(p);

/* Nearest whole-number ratio of an image (v5.5). The stored image is a resized
   copy, so its pixel ratio is usually a hair off the generation size — 1280x731
   rather than 16:9. Searches small terms first and takes the first within 0.2%
   (resize rounding at a 1280 edge stays under 0.1%, while 0.5% would read 13:19
   SDXL portraits as 11:16),
   so the hint reads as the ratio that was actually chosen (16:9, 2:3, 7:9), not
   the raw reduced fraction. Marked ≈ when it is not exact. */
function nearestRatio(w,h){
  w=+w; h=+h;
  if(!(w>0) || !(h>0)) return '';
  const R=Math.max(w,h)/Math.min(w,h);
  let best=null;
  for(let n=1;n<=24;n++){
    const m=Math.round(n*R), err=Math.abs(m/n-R)/R;
    if(!best || err<best.err-1e-12) best={n,m,err};
    if(err<=0.002){ best={n,m,err}; break; }
  }
  const g=gcd(best.m,best.n)||1, M=best.m/g, N=best.n/g;
  const txt = w>=h ? `${M}:${N}` : `${N}:${M}`;
  return (best.err<1e-9 ? '' : '≈ ')+txt;
}

  return `<span class="ratiotag" title="Image ratio, rounded to whole numbers — a hint at the generation size used. Stored copy is ${im.w}×${im.h}px.">${nearestRatio(im.w, im.h)}</span>`;
}

/* ---------- Display settings (v5.6) ----------
   Card size is a minimum card width fed to the Library grid as --card-w. The
   preview beside the slider is drawn at the width a card will REALLY get in the
   Library at the current window size — not the slider value, since 1fr stretches
   columns to fill the row. The Library's grid width is derived from the layout
   (window minus rail, main padding and rollup padding) because the Library is not
   on screen while this is open. The slider updates the preview by targeted DOM
   writes while dragging (a full render would steal the slider's focus) and saves
   once, on release. */
const LIB_GRID_INSET=30*2 + 16*2 + 2;    // .main side padding + .rollup-body padding + rollup border
const CARD_GAP=16;
function libraryGridWidth(){
  const app=document.querySelector('.app'), rail=document.querySelector('.rail');
  const appW=app ? app.clientWidth : 0;
  // under 900px the rail becomes a top bar and .main padding drops to 16px (see @media)
  const wide=window.innerWidth>900;
  const railW=wide && rail ? rail.offsetWidth : 0;
  const inset=wide ? LIB_GRID_INSET : 16*2 + 16*2 + 2;
  return Math.max(0, appW - railW - inset);
}
function cardLayoutFor(minW){
  const G=libraryGridWidth();
  if(!G) return {cols:1, width:minW};
  const cols=Math.max(1, Math.floor((G+CARD_GAP)/(minW+CARD_GAP)));
  const width=cols===1 ? G : (G - CARD_GAP*(cols-1))/cols;
  return {cols, width:Math.floor(width)};
}

/* "Stored now" — a plain statement of what is actually on disk, which is the thing
   this app got wrong for a long time: it rendered from memory and never said whether
   the write landed. The localStorage figure is read back OUT of storage rather than
   computed from `db`, so it reflects what a reload would really find.
   Image-store figures need an async IndexedDB pass, so viewData() renders the row set
   with stats=null (placeholder) and refreshStoredNow() patches the container after —
   the same targeted-DOM-write pattern the search box uses. */
function fmtBytes(chars){
  if(chars==null) return '—';
  if(chars<1024) return chars+' B';
  if(chars<1024*1024) return (chars/1024).toFixed(1)+' KB';
  return (chars/(1024*1024)).toFixed(2)+' MB';
}

/* ============================ lightbox ============================ */
function closeModal(){ $('#modalRoot').innerHTML=''; closeImageViewer(); }
/* Image viewer (v6.6): the editor's thumbnail opens the image full size, sized
   like the lightbox, with nothing but a close button. It draws into its own root
   ABOVE the editor, so the editor (and anything typed but not saved) stays
   exactly as it was underneath. It shows the image as it is in the editor right
   now, including one just picked and not yet saved. Esc, ✕ or a click outside
   closes it, and Esc closes only the viewer, not the editor. */
function openImageViewer(){
  const im=curDraft() && curDraft().image; if(!im || !im.data) return;
  $('#viewerRoot').innerHTML=`<div class="scrim imgviewer" onclick="if(event.target===this)closeImageViewer()">
    <div class="modal" id="ivModal" style="width:${lightboxWidthCSS(im.w, im.h)};position:relative">
      <button class="iconbtn vclose" onclick="closeImageViewer()" aria-label="Close" title="Close (Esc)">✕</button>
      <img src="${im.data}" alt="" onload="if(!(${+im.w||0}&&${+im.h||0})){const m=document.getElementById('ivModal'); if(m) m.style.width=lightboxWidthCSS(this.naturalWidth,this.naturalHeight);}" style="display:block;width:100%;max-height:${LB_IMG_VH}vh;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);margin-top:26px">
    </div></div>`;
}
function closeImageViewer(){ const r=document.getElementById('viewerRoot'); if(r) r.innerHTML=''; }
function imageViewerOpen(){ return !!document.querySelector('#viewerRoot .imgviewer'); }
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && imageViewerOpen()){ e.preventDefault(); e.stopPropagation(); closeImageViewer(); }
}, true);
/* The card thumbnail is cropped to a fixed aspect ratio; this shows the whole
   stored image (uncropped, up to its saved resolution).
   v6.0: the lightbox walks IMAGES, not cards. `items` is every imaged variant of
   every card in the SAME category that is visible in that rollup (so an active
   search/tag filter narrows it, matching what is on screen), in card order then
   variant order. ‹ › / ← → step through that list, so a card's variants come
   first and then the next card; Shift+← → jumps a whole card; 1–9, 0 pick a
   variant of the current card. Variants with no image are shown in the strip as
   "no image" tiles (so the count stays honest) and are never stepped onto. */
let lbKeysBound=false;
function lightboxItemsFor(catKey){
  const items=[];
  for(const x of visibleList()){
    if((x.categoryId||'__uncat__')!==catKey) continue;
    for(let j=0;j<vCount(x);j++) if(imageFor(vAt(x,j))) items.push([x.id,j]);
  }
  return items;
}
function openImageLightbox(id, vi){
  const p=db.prompts.find(x=>x.id===id); if(!p) return;
  if(vi==null) vi=shownIdx(p);
  const items=lightboxItemsFor(p.categoryId||'__uncat__');
  let idx=items.findIndex(t=>t[0]===id && t[1]===vi);
  if(idx<0) idx=items.findIndex(t=>t[0]===id);
  if(idx<0) return;
  lightboxState={items, index:idx, cardChanged:false};
  if(!lbKeysBound){ document.addEventListener('keydown', onLightboxKey); lbKeysBound=true; }
  renderLightbox();
}
function lightboxCurrent(){
  const t=lightboxState.items[lightboxState.index]; if(!t) return null;
  const p=db && db.prompts.find(x=>x.id===t[0]); if(!p) return null;
  return {p, vi:t[1], v:vAt(p,t[1])};
}
function lightboxCards(){ const seen=[]; for(const t of lightboxState.items) if(!seen.includes(t[0])) seen.push(t[0]); return seen; }
function renderLightbox(){
  const cur=lightboxCurrent();
  const im=cur && imageFor(cur.v);
  if(!cur || !im){ closeModal(); return; }
  const {p, vi, v}=cur, id=p.id, n=vCount(p);
  // keep the card behind the scrim on the variant being viewed (session only)
  if(shownVar[id]!==vi){ shownVar[id]=vi; refreshCard(id); }
  const cards=lightboxCards(), C=cards.length, ci=cards.indexOf(id);
  const canStep=lightboxState.items.length>1;
  const pos=(C>1?` · card ${ci+1} of ${C}`:'')+(n>1?` · variant ${vi+1} of ${n}`:'');
  const vchip=n>1?`<span class="lbvchip">${esc(variantName(p,vi))}${vi===0?' · primary':''}</span>`:'';
  const tagChips=(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const strip=n>1?`<div class="lbstrip" role="group" aria-label="Variants of this card">${Array.from({length:n},(_,j)=>{
      const x=vAt(p,j), xi=imageFor(x), nm=esc(variantName(p,j));
      return xi
        ? `<button type="button" class="${j===vi?'on':''}" onclick="lightboxPick(${j})" title="Variant ${j+1}: ${nm}" aria-label="Variant ${j+1}, ${nm}"><img src="${xi.data}" alt=""><span>${j+1} · ${nm}</span></button>`
        : `<button type="button" disabled title="Variant ${j+1} has no image" aria-label="Variant ${j+1}, ${nm}, no image"><div class="noimg">no image</div><span>${j+1} · ${nm}</span></button>`;
    }).join('')}</div>`:'';

/* Lightbox sizing (v5.5). It used to be a fixed 720px wide, which suited portrait
   (height-bound at 70vh) but left landscape images width-bound and small. Now the
   modal is sized from the image's own ratio so a landscape image grows until it
   meets the same height limit portrait already hit, capped by the window width.
   720px stays the floor, so portrait looks exactly as before. 44px = modal padding. */
const LB_IMG_VH=72;
function lightboxWidthCSS(w,h){
  const ar=(w>0 && h>0) ? w/h : 0;
  if(!ar) return 'min(720px,96vw)';
  return `min(96vw, max(720px, calc(${ar.toFixed(4)} * ${LB_IMG_VH}vh + 44px)))`;
}
// Older images may lack stored w/h; fill the ratio and width from the decoded image.
function onLightboxImgLoad(img){
  const cur=lightboxCurrent(), im=cur && imageFor(cur.v);
  if(!im || (im.w && im.h)) return;
  const m=$('#lbModal'); if(m) m.style.width=lightboxWidthCSS(img.naturalWidth, img.naturalHeight);
  const r=$('#lbRatio'); if(r) r.innerHTML=imageRatioTag({w:img.naturalWidth, h:img.naturalHeight});
}
function lightboxGo(index){
  const L=lightboxState.items.length; if(!L) return;
  const before=lightboxState.items[lightboxState.index];
  lightboxState.index=((index%L)+L)%L;
  const after=lightboxState.items[lightboxState.index];
  lightboxState.cardChanged=!!(before && after && before[0]!==after[0]);
  renderLightbox();
}
function lightboxStep(delta){ lightboxGo(lightboxState.index+delta); }
// Shift+arrow: to the previous/next CARD, landing on the variant that card is showing
function lightboxJumpCard(delta){
  const cards=lightboxCards(); if(cards.length<2) return;
  const cur=lightboxState.items[lightboxState.index];
  const target=cards[(cards.indexOf(cur[0])+delta+cards.length)%cards.length];
  const tp=db.prompts.find(x=>x.id===target), want=tp?shownIdx(tp):0;
  let k=lightboxState.items.findIndex(t=>t[0]===target && t[1]===want);
  if(k<0) k=lightboxState.items.findIndex(t=>t[0]===target);
  lightboxGo(k);
}
function lightboxPick(j){
  const cur=lightboxState.items[lightboxState.index]; if(!cur) return;
  const k=lightboxState.items.findIndex(t=>t[0]===cur[0] && t[1]===j);
  if(k>=0) lightboxGo(k);
}
// Only acts while the lightbox is open; the lightbox has no text fields to steal keys from.
function onLightboxKey(e){
  if(!document.querySelector('#modalRoot .imglightbox')) return;
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
    const d=e.key==='ArrowLeft'?-1:1;
    e.preventDefault();
    if(e.shiftKey) lightboxJumpCard(d); else lightboxStep(d);
  } else if(/^[0-9]$/.test(e.key)){
    e.preventDefault();
    lightboxPick(e.key==='0' ? 9 : (+e.key)-1);
  } else if(e.key==='Escape'){
    closeModal();
  }
}

/* ============================ add/edit card modal ============================
   v6.0: one card holds up to MAX_VARIANTS prompts. The editor shows a tab per
   variant; everything in the grey panel belongs to the selected variant, and
   category / tags / Protected below it are shared by the whole card.
   modalState.vars holds a DRAFT of every variant. The DOM only ever shows one,
   so captureModal() copies the visible fields back into its draft before
   anything re-renders (tab switch, image pick, any variant action). Nothing
   touches db until Save, and Save follows the honest-save contract. */
function varDraft(v, keepId){
  v=v||{};
  return { id: keepId ? (v.id||null) : null, createdAt: keepId ? (v.createdAt||null) : null,
    label:v.label||'', promptText:v.promptText||'', negativePrompt:v.negativePrompt||'', seed:v.seed||'',
    width:v.width||'', height:v.height||'', comments:v.comments||'', image:imageFor(v) };
}

function captureModal(){

    d.seed=val('f_seed'); d.width=val('f_width'); d.height=val('f_height'); d.comments=val('f_comments');
  }
  if(document.getElementById('f_category')){
    modalState.shared.categoryId=val('f_category')||'';
    modalState.shared.tags=val('f_tags')||'';
    modalState.shared.nsfw=!!$('#f_nsfw').checked;

}

/* v6.8: prompt boxes grow with their text instead of scrolling inside a fixed box.
   CSS sets each one's minimum; the maximum is a share of the window, past which
   the box scrolls as before, so one huge prompt can't push everything else away. */
const GROW_MAX={f_prompt:.6, f_negprompt:.3, f_comments:.3};
function autoGrow(el){
  if(!el) return;
  el.style.height='auto';
  const sh=el.scrollHeight; if(!sh) { el.style.height=''; return; }   // not laid out (hidden / no layout engine)
  const h=sh+(el.offsetHeight-el.clientHeight), max=Math.round((GROW_MAX[el.id]||.5)*window.innerHeight);
  el.style.height=Math.min(h,max)+'px';
  el.style.overflowY=h>max?'auto':'hidden';

function switchVariant(j){
  captureModal();
  if(j<0 || j>=modalState.vars.length) return;
  modalState.idx=j; modalState.msg='';
  renderPromptModal();
}
function variantAction(a){
  captureModal();
  const s=modalState, n=s.vars.length, i=s.idx, d=s.vars[i], name=draftName(d,i);
  const move=(from,to)=>{ const [m]=s.vars.splice(from,1); s.vars.splice(to,0,m); s.idx=to; };
  let msg='';
  if(a==='new'){
    if(n>=MAX_VARIANTS) return toast(`A card holds up to ${MAX_VARIANTS} prompts`);
    s.vars.push(Object.assign(varDraft(null), {width:d.width, height:d.height}));
    s.idx=n; msg='New blank variant — the size was carried over from the one you were on.';
  } else if(a==='dup'){
    if(n>=MAX_VARIANTS) return toast(`A card holds up to ${MAX_VARIANTS} prompts`);
    s.vars.splice(i+1, 0, Object.assign(varDraft(d,false), {label: d.label ? d.label+' copy' : ''}));
    s.idx=i+1; msg='Duplicated — change the prompt, attach the new image, then save.';
  } else if(a==='primary'){
    if(i===0) return; move(i,0); msg=`“${name}” is now the primary — it shows first on the card.`;
  } else if(a==='left'){ if(i===0) return; move(i,i-1); }
  else if(a==='right'){ if(i>=n-1) return; move(i,i+1); }
  else if(a==='split'){
    if(n<=1) return;
    if(!(d.promptText||'').trim()) return toast('Give this variant a prompt before splitting it out');
    s.splits.push(s.vars.splice(i,1)[0]); s.idx=Math.max(0,i-1);
    msg=`“${name}” will become its own card (same category and tags) when you save.`;
  } else if(a==='delete'){
    if(n<=1) return;
    s.vars.splice(i,1); s.idx=Math.max(0,i-1);
    msg=`“${name}” removed. Nothing is written until you save.`;
  } else return;
  s.msg=msg;
  renderPromptModal();
}
function cleanDraft(d){
  return { label:(d.label||'').trim(), promptText:(d.promptText||'').trim(), negativePrompt:(d.negativePrompt||'').trim(),
    seed:(d.seed||'').trim(), width:parseInt(d.width,10)||null, height:parseInt(d.height,10)||null,
    comments:(d.comments||'').trim(), image:d.image||null };
}
async function savePromptModal(){
  captureModal();
  const s=modalState;
  for(let j=0;j<s.vars.length;j++){
    if(!(s.vars[j].promptText||'').trim()){
      if(s.idx!==j){ s.idx=j; s.msg=''; renderPromptModal(); }
      return toast(s.vars.length>1 ? `Enter a prompt for variant ${j+1}` : 'Enter a prompt');
    }
  }
  const now=new Date().toISOString();
  const tags=String(s.shared.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
  const categoryId=s.shared.categoryId||null, nsfw=!!s.shared.nsfw;
  const isEdit=!!s.id;
  /* The primary keeps the pre-v6 field names on the card itself, so a vault
     with no variants is byte-for-byte the v5 shape and the browser build still
     reads the primary. Alternates go in `variants`, which is omitted when empty. */
  const [prim, ...rest]=s.vars.map(cleanDraft);
  const variants=rest.map((v,k)=>{ const src=s.vars[k+1];
    const o=Object.assign({id: src.id || 'v'+uid().slice(1), createdAt: src.createdAt || now}, v);
    if(!o.label) delete o.label; return o; });
  let p=s.id ? db.prompts.find(x=>x.id===s.id) : null;
  const fields=Object.assign({}, prim, {tags, nsfw, categoryId});
  if(p){ Object.assign(p, fields); p.updatedAt=now; }
  else { p=Object.assign({id:uid(), createdAt:now, updatedAt:now}, fields); db.prompts.push(p); }
  if(!p.label) delete p.label;
  if(variants.length) p.variants=variants; else delete p.variants;
  const splitCards=s.splits.map(x=>{ const c=Object.assign({id:uid(), createdAt:now, updatedAt:now}, cleanDraft(x), {tags:tags.slice(), nsfw, categoryId});
    if(!c.label) delete c.label; return c; });
  for(const c of splitCards) db.prompts.push(c);
  shownVar[p.id]=Math.min(s.idx, vCount(p)-1);
  const ok=await saveDB();
  closeModal(); render();
  if(ok){
    if(splitCards.length) toast(`Saved — ${splitCards.length} variant${splitCards.length===1?'':'s'} moved to ${splitCards.length===1?'its own card':'their own cards'}`);
    else toast(isEdit?'Prompt updated':'Prompt added');
  }
}
async function deletePromptConfirm(id){
  const p=db.prompts.find(x=>x.id===id); if(!p) return;
  const n=vCount(p);
  if(!confirm(n>1 ? `Delete this card and all ${n} of its variants? This cannot be undone.` : 'Delete this prompt? This cannot be undone.')) return;
  db.prompts=db.prompts.filter(x=>x.id!==id);
  delete shownVar[id];
  const ok=await saveDB(); closeModal(); render();
  if(ok) toast(n>1?'Card deleted':'Prompt deleted');
}
// Copies what is in the box now, including unsaved edits — that is what you see.
function copyModalPrompt(){
  const el=$('#f_prompt'); if(!el) return;
  copyText(el.value, 'Prompt copied');
}
function copyText(text, okMsg){
  return navigator.clipboard.writeText(text||'').then(()=>{ if(okMsg) toast(okMsg); return true; })
    .catch(()=>{ toast('Copy failed — clipboard blocked'); return false; });
}
// Copies the positive prompt of variant `vi` (default: the one the card is showing).
function copyPrompt(id, vi){
  const p=db.prompts.find(x=>x.id===id); if(!p) return;
  const v=vAt(p, vi==null ? shownIdx(p) : vi);
  return copyText(v.promptText||'', 'Prompt copied');
}

/* ============================ PIN gate ============================
   The PIN is the vault key: nothing is readable until it is entered, and the
   app opens into this gate rather than into the Library. */
function gateHTML(mode, msg){
  const first = mode==='create', nv = mode==='newvault', missing = mode==='missing';
  const title = nv ? 'Create a new vault' : first ? 'Create your vault' : missing ? 'Vault not found' : 'Unlock';
  const hint = nv ? 'A separate encrypted file with its own passphrase. It starts empty.'
    : first ? 'Choose a passphrase. It encrypts the whole vault file and is never stored anywhere — if you lose it, the vault cannot be recovered by anyone.'
    : missing ? 'There is no file at this path. It may have been moved or renamed, or a network drive may be offline. Choose another vault, or try again.'
    : 'Enter the passphrase for '+(vaultName?'<b>'+esc(vaultName)+'</b>':'this vault')+'.';
  const pins = missing ? '' : `<input id="gatePin" type="password" placeholder="Passphrase" ${nv?'':'autofocus'}
           onkeydown="if(event.key==='Enter')submitGate('${mode}')">
    ${first||nv?`<input id="gatePin2" type="password" placeholder="Repeat passphrase"
           onkeydown="if(event.key==='Enter')submitGate('${mode}')">`:''}`;
  const btn = missing ? `<button class="btn brass" onclick="retryMissing()">Try again</button>`

async function submitGate(mode){
  const pin=$('#gatePin').value;
  if(mode==='newvault'){
    captureNewVault();
    const prob=vaultNameProblem(newVaultDraft.name);
    if(prob) return gateMsg(prob);
    if(pin.length<4) return gateMsg('Passphrase: at least 4 characters.');
    if(pin!==$('#gatePin2').value) return gateMsg('The two entries do not match.');
    const r=await call('create_vault', pin, newVaultDraft.name.trim(), newVaultDraft.folder);
    if(!r.ok) return gateMsg(r.error||'Could not create the vault.');
    gateMode=null; gateNote='';
    db=r.db; expandedCats=r.expanded||{}; sessionUnlocked=true; view='library';
    await refreshVaultStatus(); render();
    toast('Vault '+vaultName+' created');
    return;
  }
  if(pin.length<4) return gateMsg('At least 4 characters.');
  if(mode==='create'){
    if(pin!==$('#gatePin2').value) return gateMsg('The two entries do not match.');
    const r=await call('create_vault', pin);
    if(!r.ok) return gateMsg(r.error||'Could not create the vault.');
    gateNote='';
    db=r.db; expandedCats=r.expanded||{}; sessionUnlocked=true; view='library';
    await refreshVaultStatus(); render(); return;
  }
  gateMsg('Deriving key…');
  const r=await call('unlock', pin);
  if(!r.ok) return gateMsg(r.error||'Could not unlock.');
  gateNote='';
  db=r.db; expandedCats=r.expanded||{}; sessionUnlocked=true; view='library';
  await refreshVaultStatus(); render();
  if(r.upgraded) toast(`Vault re-encrypted — key derivation raised to ${r.upgraded.to.toLocaleString()} iterations`);
}

/* ---------- merge import (v6.5) ----------
   FINGERPRINT. A prompt's fingerprint is its defining content: prompt text,
   negative prompt, seed and generation size, with whitespace collapsed and
   trimmed (case is kept). Name, notes, image, tags, category, Protected and
   timestamps are DETAILS about a prompt and are compared separately, so editing
   notes does not make a prompt "different". A card's fingerprint is the multiset
   of its prompts' fingerprints. Computed on the fly from both libraries, never
   stored, so nothing has to be kept in step on edit and browser-build backups
   work too. (It is the canonical string itself, not a hash: it is only ever
   compared in memory, so there is nothing a hash would add.)
   CLASSES, per incoming card:
     identical: a card here has the same fingerprint and the same details  -> skipped
     changed:   same fingerprint, different details        -> ALWAYS ASK (mine / backup's)
     overlap:   shares the card id or at least one prompt with a card here, but is not
                the same card                               -> added as a SEPARATE card,
                and it and the cards it overlaps get the AUDIT_TAG for manual attention
     new:       nothing in common                          -> added
   Categories are matched by name (case-insensitive); missing ones are created.
   An incoming id already used here is replaced with a fresh one. */
const AUDIT_TAG='audit-overlap';
function fpNorm(x){ return String(x==null?'':x).replace(/\s+/g,' ').trim(); }
function variantFP(v){ return JSON.stringify([fpNorm(v.promptText), fpNorm(v.negativePrompt), fpNorm(v.seed), v.width?String(v.width):'', v.height?String(v.height):'']); }
function cardFPs(p){ return Array.from({length:vCount(p)},(_,i)=>variantFP(vAt(p,i))); }
function sameMultiset(a,b){ if(a.length!==b.length) return false; const x=[...a].sort(), y=[...b].sort(); return x.every((k,i)=>k===y[i]); }
function catNameIn(d,id){ return id ? (((d.libCategories||[]).find(c=>c.id===id)||{}).name||'') : ''; }
// What differs between two cards with the same fingerprint (human-readable list).
function cardDetailDiffs(cur, curDb, inc, incDb){
  const out=[];
  const tags=p=>[...new Set(p.tags||[])].filter(t=>t!==AUDIT_TAG).sort().join('\u0001');   // our own review tag is not a difference
  if(tags(cur)!==tags(inc)) out.push('tags');
  if(catNameIn(curDb,cur.categoryId).toLowerCase()!==catNameIn(incDb,inc.categoryId).toLowerCase()) out.push('category');
  if(!!cur.nsfw!==!!inc.nsfw) out.push('Protected');
  const cf=cardFPs(cur), inf=cardFPs(inc);
  if(cf.join('\u0002')!==inf.join('\u0002')) out.push('variant order');
  // pair variants by fingerprint, in order
  const used=new Set(); let names=false, notes=false, imgs=false;
  for(let i=0;i<inf.length;i++){
    const j=cf.findIndex((k,jj)=>k===inf[i] && !used.has(jj)); if(j<0) continue; used.add(j);
    const a=vAt(cur,j), b=vAt(inc,i);
    if(fpNorm(a.label)!==fpNorm(b.label)) names=true;
    if(String(a.comments||'').trim()!==String(b.comments||'').trim()) notes=true;
    const ia=imageFor(a), ib=imageFor(b);
    if((ia?ia.data:'')!==(ib?ib.data:'')) imgs=true;
  }
  if(names) out.push('names'); if(notes) out.push('notes'); if(imgs) out.push('images');
  return out;
}
function planMerge(curDb, incDb){
  const plan={added:[], identical:[], changed:[], overlaps:[], newCats:[]};
  const byFP=new Map(), byId=new Map();
  for(const p of curDb.prompts){ byId.set(p.id,p); for(const k of cardFPs(p)){ if(!byFP.has(k)) byFP.set(k,new Set()); byFP.get(k).add(p); } }
  for(const inc of (incDb.prompts||[])){
    if(!inc || typeof inc!=='object') continue;
    const fps=cardFPs(inc), cands=new Set();
    if(byId.has(inc.id)) cands.add(byId.get(inc.id));
    for(const k of fps) for(const p of (byFP.get(k)||[])) cands.add(p);
    if(!cands.size){ plan.added.push(inc); continue; }
    const exact=[...cands].filter(p=>sameMultiset(cardFPs(p),fps));
    const match=exact.find(p=>p.id===inc.id) || exact[0];
    if(match){
      const diffs=cardDetailDiffs(match, curDb, inc, incDb);
      if(diffs.length) plan.changed.push({inc, cur:match, diffs, choice:null});
      else plan.identical.push({inc, cur:match});
      continue;
    }
    const shared=fps.filter(k=>[...cands].some(p=>cardFPs(p).includes(k)));
    plan.overlaps.push({inc, curIds:[...cands].map(p=>p.id), shared:new Set(shared).size});
  }
  const have=new Set(curDb.libCategories.map(c=>c.name.trim().toLowerCase()));
  for(const it of plan.added.concat(plan.overlaps.map(o=>o.inc), plan.changed.map(c=>c.inc))){
    const n=catNameIn(incDb, it.categoryId).trim();
    if(n && !have.has(n.toLowerCase())){ have.add(n.toLowerCase()); plan.newCats.push(n); }
  }
  // a changed card whose backup version is never chosen does not need its category
  return plan;
}
// Applies a plan to db in memory. Returns counts. The caller saves.
function applyMerge(plan, incDb){
  const catFor=new Map();
  const mapCat=incCatId=>{
    const n=catNameIn(incDb, incCatId).trim(); if(!n) return null;
    const key=n.toLowerCase();
    if(catFor.has(key)) return catFor.get(key);
    let c=db.libCategories.find(x=>x.name.trim().toLowerCase()===key);
    if(!c){ c={id:uid(), name:n}; db.libCategories.push(c); }
    catFor.set(key, c.id); return c.id;
  };
  const ids=new Set(db.prompts.map(p=>p.id));
  const bring=(inc, extraTag)=>{
    const c=JSON.parse(JSON.stringify(inc));
    if(!c.id || ids.has(c.id)) c.id=uid();
    ids.add(c.id);
    c.categoryId=mapCat(inc.categoryId);
    c.tags=Array.isArray(c.tags)?c.tags:[];
    if(extraTag && !c.tags.includes(extraTag)) c.tags.push(extraTag);
    delete c.enc;
    return c;
  };
  let added=0, updated=0, overlaps=0;
  for(const inc of plan.added){ db.prompts.push(bring(inc)); added++; }
  for(const o of plan.overlaps){
    db.prompts.push(bring(o.inc, AUDIT_TAG)); overlaps++;
    for(const id of o.curIds){ const p=db.prompts.find(x=>x.id===id); if(p){ p.tags=Array.isArray(p.tags)?p.tags:[]; if(!p.tags.includes(AUDIT_TAG)) p.tags.push(AUDIT_TAG); } }
  }
  for(const ch of plan.changed){
    if(ch.choice!=='theirs') continue;
    const i=db.prompts.findIndex(x=>x.id===ch.cur.id); if(i<0) continue;
    const c=JSON.parse(JSON.stringify(ch.inc));
    c.id=ch.cur.id; c.categoryId=mapCat(ch.inc.categoryId); c.tags=Array.isArray(c.tags)?c.tags:[];
    delete c.enc; delete shownVar[c.id];
    db.prompts[i]=c; updated++;
  }
  return {added, updated, overlaps};
}
let mergeImport=null;

        <div class="mr-sub">Differs in: ${esc(c.diffs.join(', '))} · yours edited ${when(c.cur.updatedAt)} · backup's ${when(c.inc.updatedAt)}</div></div>

    </div>`).join('');
  const nothing=!P.added.length && !P.overlaps.length && !P.changed.length;

      <div class="mstats">

        ${stat(P.overlaps.length,'overlap — added separately','ovl')}
      </div>
      ${P.newCats.length?`<div class="sub" style="margin:10px 0 0">New categories: ${P.newCats.map(n=>`<span class="tag">${esc(n)}</span>`).join(' ')}</div>`:''}
      ${P.changed.length?`<div class="msec"><div class="msec-h"><span class="rowlabel">Changed cards</span>
          <span style="display:flex;gap:6px"><button class="btn sm" onclick="mergeImportChooseAll('mine')">Keep all mine</button><button class="btn sm" onclick="mergeImportChooseAll('theirs')">Use all backup's</button></span></div>
          <div class="sub" style="margin:0 0 8px">Same prompts on both sides, but something about them differs. Choose which version to keep for each.</div>${changedRows}</div>`:''}
      ${P.overlaps.length?`<div class="msec"><div class="msec-h"><span class="rowlabel">Overlapping cards</span></div>
          <div class="sub" style="margin:0 0 8px">These share some prompts (or a card id) with cards you already have, but are not the same card. They are added as separate cards, and both they and the cards they overlap get the tag <span class="tag">${AUDIT_TAG}</span>. Filter by that tag to review them, then remove it.</div>${overlapRows}</div>`:''}
      <div class="foot" style="align-items:center">
        ${left?`<span class="sub" style="margin:0 auto 0 0;color:var(--warn)" id="mi_left">Choose for ${left} changed card${left===1?'':'s'}</span>`:''}
        <button class="btn ghost" onclick="closeMergeImport()">${nothing?'Close':'Cancel'}</button>

      </div>

  const sc2=document.querySelector('#modalRoot .scrim'); if(sc2) sc2.scrollTop=top;
}
function mergeImportChoose(i,c){ const m=mergeImport; if(!m||!m.plan.changed[i]) return; m.plan.changed[i].choice=c; renderMergeImport(); }
function mergeImportChooseAll(c){ const m=mergeImport; if(!m) return; m.plan.changed.forEach(x=>x.choice=c); renderMergeImport(); }
function closeMergeImport(){ mergeImport=null; closeModal(); }
async function confirmMergeImport(){
  const m=mergeImport; if(!m) return;
  if(m.plan.changed.some(c=>!c.choice)) return renderMergeImport();
  // the library may have changed under the dialog; re-plan and carry the choices over by card
  const fresh=planMerge(db, m.incDb);
  const pick=new Map(m.plan.changed.map(c=>[c.inc, c.choice]));
  for(const c of fresh.changed) c.choice=pick.get(c.inc)||null;
  if(fresh.changed.some(c=>!c.choice)){ m.plan=fresh; return renderMergeImport(); }
  mergeImport=null;
  const r=applyMerge(fresh, m.incDb);
  const ok=await saveDB();
  closeModal(); render();
  if(ok){
    const parts=[];
    if(r.added) parts.push(`${r.added} added`);
    if(r.updated) parts.push(`${r.updated} updated`);
    if(r.overlaps) parts.push(`${r.overlaps} overlap${r.overlaps===1?'':'s'} tagged ${AUDIT_TAG}`);
    toast('Merged — '+(parts.join(', ')||'no changes'));
  }
}

/* ============================ right-click menu ============================
   Not by design: pywebview ties WebView2's built-in context menu to debug mode
   (AreDefaultContextMenusEnabled = debug), so a normal launch has no menu at
   all. Turning debug on would bring it back along with "Inspect" and DevTools,
   so the app draws its own — Cut / Copy / Paste / Select all for text fields,
   Copy for selected page text. Keyboard shortcuts were never affected.
   Paste reads the clipboard through Python (Api.clipboard_text) because the
   browser clipboard-read API asks for permission inside WebView2. */
let ctxTarget=null, ctxSel=null;
const CTX_TEXT_TYPES=['text','search','number','password','email','url','tel',''];
function ctxEditable(el){
  if(!el) return null;
  if(el.tagName==='TEXTAREA') return el;
  if(el.tagName==='INPUT' && CTX_TEXT_TYPES.includes((el.getAttribute('type')||'').toLowerCase())) return el;
  return null;
}
function fieldSel(el){
  try{ return {s:el.selectionStart, e:el.selectionEnd}; }catch(_){ return {s:null, e:null}; }   // type=number has no selection API
}
function closeCtxMenu(){ const r=$('#ctxRoot'); if(r) r.innerHTML=''; ctxTarget=null; ctxSel=null; }
function openCtxMenu(ev){
  const el=ctxEditable(ev.target);
  const pageText=String(window.getSelection ? window.getSelection() : '');
  ev.preventDefault();
  if(!el && !pageText){ closeCtxMenu(); return; }
  ctxTarget=el;
  let hasSel=!!pageText, isPw=false, ro=false;
  if(el){
    ctxSel=fieldSel(el);
    isPw=(el.getAttribute('type')||'').toLowerCase()==='password';
    ro=el.readOnly || el.disabled;
    hasSel = ctxSel.s!=null ? ctxSel.e>ctxSel.s : false;
  } else ctxSel={page:pageText};
  const item=(act,label,key,enabled)=>`<button type="button" ${enabled?'':'disabled'} onclick="ctxDo('${act}')"><span>${label}</span><kbd>${key}</kbd></button>`;
  const html = el
    ? item('cut','Cut','Ctrl+X',hasSel && !isPw && !ro)
      + item('copy','Copy','Ctrl+C',hasSel && !isPw)
      + item('paste','Paste','Ctrl+V',!ro)
      + '<hr>' + item('selectall','Select all','Ctrl+A',!!el.value)
    : item('copy','Copy','Ctrl+C',true);
  const root=$('#ctxRoot');
  // mousedown is cancelled so clicking an item keeps the field's focus and selection
  root.innerHTML=`<div class="ctxmenu" id="ctxMenu" onmousedown="event.preventDefault()">${html}</div>`;
  const m=$('#ctxMenu');
  const W=window.innerWidth, H=window.innerHeight, mw=m.offsetWidth||170, mh=m.offsetHeight||150;
  m.style.left=Math.max(4, Math.min(ev.clientX, W-mw-4))+'px';
  m.style.top =Math.max(4, Math.min(ev.clientY, H-mh-4))+'px';
}
function insertIntoField(el, text){
  el.focus();
  // execCommand keeps the field's own undo history; setRangeText is the fallback
  let done=false;
  try{ done=document.execCommand && document.execCommand('insertText', false, text); }catch(_){ done=false; }
  if(done) return;
  const {s,e}=fieldSel(el);
  if(s==null){ el.value=text; }
  else { el.setRangeText(text, s, e, 'end'); }
  el.dispatchEvent(new Event('input', {bubbles:true}));
}
async function readClipboard(){
  const r=await call('clipboard_text');
  if(r.ok) return r.text||'';
  try{ return await navigator.clipboard.readText(); }catch(_){ return null; }
}
async function ctxDo(act){
  const el=ctxTarget, sel=ctxSel;
  closeCtxMenu();
  if(!el){ if(act==='copy' && sel && sel.page) copyText(sel.page); return; }
  el.focus();
  if(sel && sel.s!=null){ try{ el.setSelectionRange(sel.s, sel.e); }catch(_){} }
  const chosen = sel && sel.s!=null ? el.value.slice(sel.s, sel.e) : '';
  if(act==='copy'){ if(chosen) copyText(chosen); }
  else if(act==='cut'){ if(chosen && await copyText(chosen)) insertIntoField(el, ''); }
  else if(act==='paste'){
    const t=await readClipboard();
    if(t==null) return toast('Paste failed — use Ctrl+V');
    if(sel && sel.s!=null){ try{ el.setSelectionRange(sel.s, sel.e); }catch(_){} }
    insertIntoField(el, t);
  }
  else if(act==='selectall'){ el.select(); }
}
document.addEventListener('contextmenu', openCtxMenu);
document.addEventListener('mousedown', e=>{ if(!e.target.closest || !e.target.closest('#ctxMenu')) closeCtxMenu(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeCtxMenu(); });
window.addEventListener('blur', closeCtxMenu);
window.addEventListener('resize', closeCtxMenu);
document.addEventListener('scroll', closeCtxMenu, true);

/* ============================ boot ============================ */
async function boot(){
  await apiReady();
  const st=await call('status');
  if(!st.ok){ document.getElementById('main').innerHTML='<p class="hint" style="padding:30px">'+esc(st.error||'No desktop bridge.')+'</p>'; return; }
  APP_VERSION=st.appVersion; APP_BUILD=st.appBuild; applyStatus(st);
  if(st.ui && typeof st.ui==='object') uiPrefs=Object.assign(uiPrefs, st.ui);
  applyCardWidth();
  if(st.lock && !st.lock.stale){
    if(!confirm('This vault appears to be open already:\n\n  '+st.lock.host+' (pid '+st.lock.pid+') since '+st.lock.since+
                '\n\nTwo copies writing to one vault will lose work. Open anyway?')) { window.close(); return; }
  }
  render();
  const gp=document.getElementById('gatePath');
  if(gp) gp.textContent=vaultPath;
}
boot();
</script>
</body>
</html>
